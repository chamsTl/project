<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <title>HRMS | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <div class="container">
    <button class="theme-toggle" onclick="toggleTheme()">🌙 Toggle Theme</button>

    <div class="left-panel">
      <h2>Welcome Back!</h2>
      <p>Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>

      <!-- ✅ عرض رسائل الخطأ -->
      {% if messages %}
        <ul class="messages">
          {% for message in messages %}
            <li style="color: red;">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}

      <!-- ✅ الفورم المعدل -->
      <form method="post">
        {% csrf_token %}
        <div class="input-group">
          <label for="username">Email</label>
          <input type="email" id="username" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="mot_de_passe" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
    </div>

    <div class="right-panel">
      <h1>Welcome</h1>
      <p>to the HR Management<br>Platform. Your team's journey starts here.</p>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
